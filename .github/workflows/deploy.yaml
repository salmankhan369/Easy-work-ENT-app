name: Deploy Easy-work-ENT-app to AWS EKS

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  CLUSTER_NAME: easy-work-ent-cluster
  ECR_FRONTEND_REPO: easy-work-ent-frontend
  ECR_BACKEND_REPO: easy-work-ent-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Frontend Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_FRONTEND_REPO:latest app/frontend/
          docker push $REGISTRY/$ECR_FRONTEND_REPO:latest

      - name: Build & Push Backend Image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker build -t $REGISTRY/$ECR_BACKEND_REPO:latest app/backend/
          docker push $REGISTRY/$ECR_BACKEND_REPO:latest

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.CLUSTER_NAME }}

      - name: Deploy Manifests to EKS
        run: |
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml
          kubectl apply -f k8s/ingress.yaml

      - name: Verify Rolling Update Rollout
        run: |
          kubectl rollout status deployment/easy-work-backend --timeout=120s
          kubectl rollout status deployment/easy-work-frontend --timeout=120s